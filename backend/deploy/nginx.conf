# CivicLens edge configuration.
#
# The single most important lines in this file are the two `access_log off;`
# directives. An application that is careful about identifiers is undone by a
# proxy that writes $remote_addr next to POST /api/reports - that pairing is
# all an adversary with subpoena power, or server access, needs.

log_format civiclens escape=json
  '{"ts":"$time_iso8601","method":"$request_method","uri":"$uri",'
  '"status":$status,"bytes":$body_bytes_sent,"ms":$request_time,'
  '"request_id":"$sent_http_x_request_id"}';
# Note what the format omits: $remote_addr, $http_user_agent, $http_referer,
# $args. Do not add them.

upstream civiclens_public       { server public:8000;       keepalive 16; }
upstream civiclens_dept         { server dept:8000;         keepalive 16; }
upstream civiclens_investigator { server investigator:8000; keepalive 16; }

# Buckets are per-URI here, not per-address, for the same reason the
# application's are: a limit keyed on a citizen's address is a record of that
# citizen's visit.
limit_req_zone $uri zone=public_reads:10m rate=30r/s;

server {
    listen 443 ssl http2;
    server_name api.civiclens.gov.example;

    ssl_certificate     /etc/ssl/civiclens/fullchain.pem;
    ssl_certificate_key /etc/ssl/civiclens/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    server_tokens off;
    client_max_body_size 20m;

    access_log /var/log/nginx/civiclens.log civiclens;

    # ---------------------------------------------------------------- intake
    location /api/reports {
        access_log off;                       # NOT NEGOTIABLE
        proxy_set_header X-Real-IP "";        # the app must not receive it either
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Host $host;
        proxy_pass http://civiclens_public;
    }

    # Tracking is open to anyone, and who tracks which case is as sensitive as
    # who filed it.
    location ~ ^/api/cases/ {
        access_log off;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_pass http://civiclens_public;
    }

    location /api/ {
        limit_req zone=public_reads burst=60 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://civiclens_public;
    }

    # ---------------------------------------------------------------- staff
    location /api/auth/  { proxy_pass http://civiclens_dept; }
    location /api/dept/  { proxy_pass http://civiclens_dept; }

    location /api/investigator/ {
        # Restrict to the Ombudsman's network in addition to authentication.
        allow 10.20.0.0/16;
        deny all;
        proxy_pass http://civiclens_investigator;
    }

    location /metrics { deny all; }   # scraped over the internal network only
}

server {
    listen 80;
    server_name api.civiclens.gov.example;
    return 301 https://$host$request_uri;
}
