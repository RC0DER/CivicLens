# Three services from one image. Read the environment blocks side by side:
# what makes the dept service safe is the four lines it does NOT have.
#
# Copy .env.example to .env and fill in the secrets before bringing this up.
x-app: &app
  build: .
  restart: unless-stopped
  environment: &app-env
    ENV: ${ENV:-staging}
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    CASE_DB_URL: postgresql+psycopg://civiclens:${CASE_DB_PASSWORD:?}@case-db/cases
    REDIS_URL: redis://redis:6379/0
    STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
    S3_BUCKET: ${S3_BUCKET:-civiclens-evidence}
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
    CORS_ORIGINS: ${CORS_ORIGINS:?name the portal origin}
    TRUSTED_HOSTS: ${TRUSTED_HOSTS:?name the API hostname}
    METRICS_TOKEN: ${METRICS_TOKEN:?}
  depends_on:
    case-db: { condition: service_healthy }
    redis: { condition: service_started }

services:
  case-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cases
      POSTGRES_USER: civiclens
      POSTGRES_PASSWORD: ${CASE_DB_PASSWORD:?}
    volumes: [case-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civiclens -d cases"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  intake-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: intake
      POSTGRES_USER: intake
      POSTGRES_PASSWORD: ${INTAKE_DB_PASSWORD:?}
    volumes: [intake-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intake -d intake"]
      interval: 10s
      retries: 5
    restart: unless-stopped
    # Separate volume, separate credentials, separate backup policy. A restore
    # must never put this and case-data into one environment.

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # No persistence: rate-limit counters are disposable, and a disk file of
    # bucket keys is a record we do not want lying around.
    restart: unless-stopped

  public:
    <<: *app
    environment:
      <<: *app-env
      PROFILE: public
      # Write-only database role: this service seals contacts and cannot read
      # the table back.
      INTAKE_DB_URL: postgresql+psycopg://intake_writer:${INTAKE_WRITER_PASSWORD:?}@intake-db/intake
      INTAKE_HMAC_KEY: ${INTAKE_HMAC_KEY:?}
      INTAKE_ENC_KEY: ${INTAKE_SEAL_KEY:?}
    ports: ["8000:8000"]

  dept:
    <<: *app
    environment:
      <<: *app-env
      PROFILE: dept
      # No INTAKE_DB_URL. No INTAKE_HMAC_KEY. No INTAKE_ENC_KEY.
      # This is the privacy firewall, and it is three missing lines.
      # config.py refuses to start this service if they reappear.
    ports: ["8001:8000"]

  investigator:
    <<: *app
    environment:
      <<: *app-env
      PROFILE: investigator
      INTAKE_DB_URL: postgresql+psycopg://intake_reader:${INTAKE_READER_PASSWORD:?}@intake-db/intake
      INTAKE_HMAC_KEY: ${INTAKE_HMAC_KEY:?}
      INTAKE_ENC_KEY: ${INTAKE_SEAL_KEY:?}
    ports: ["8002:8000"]
    depends_on:
      case-db: { condition: service_healthy }
      intake-db: { condition: service_healthy }
      redis: { condition: service_started }

  jobs:
    <<: *app
    environment:
      <<: *app-env
      PROFILE: investigator
      INTAKE_DB_URL: postgresql+psycopg://intake_reader:${INTAKE_READER_PASSWORD:?}@intake-db/intake
      INTAKE_HMAC_KEY: ${INTAKE_HMAC_KEY:?}
      INTAKE_ENC_KEY: ${INTAKE_SEAL_KEY:?}
    # Replace with a cron sidecar or a Kubernetes CronJob in a real cluster.
    command: >
      sh -c "while true; do
        python -m app.jobs assignment_sweep;
        python -m app.jobs session_sweep;
        python -m app.jobs retention_sweep;
        sleep 3600;
      done"

volumes:
  case-data:
  intake-data:
