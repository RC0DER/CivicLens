# Two stores, two histories, two script directories:
#
#     alembic upgrade head                  # the case register
#     alembic --name intake upgrade head    # the intake store
#
# sqlalchemy.url is set by each env.py from the app settings, so there is
# exactly one place a database URL comes from.

[alembic]
script_location = migrations/case
prepend_sys_path = .
version_path_separator = os

[intake]
script_location = migrations/intake
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
