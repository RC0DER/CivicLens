[project]
name = "civiclens-api"
version = "1.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "S", "ASYNC", "DTZ", "RUF"]
ignore = [
  "S101",    # pytest uses assert
  "B008",    # FastAPI's Depends() in defaults is the documented idiom
  "S104",    # binding 0.0.0.0 inside a container is intended
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "DTZ011"]
"scripts/*" = ["S106", "T201"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
exclude = "(migrations|tests)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
